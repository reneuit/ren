<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E40AF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E3A8A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AP CRM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="AP Repair CRM">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="AP Repair CRM - Service Center Management">
<title>AP Repair CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E40AF'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>A</text></svg>">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">A</div>
    <h1>AP Repair CRM</h1>
    <p class="login-sub">Service Center Management</p>
    <div class="field">
      <label>Username</label>
      <input id="login-user" type="text" autocomplete="username" autocapitalize="none" placeholder="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="password">
    </div>
    <button id="login-btn" class="btn primary block" onclick="doLogin()">Sign In</button>
    <div id="login-err" class="login-err"></div>
    <div class="login-foot">Developed by Praveen Itagi &middot; Annapurna Software Solutions</div>
  </div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="app-view" class="app" style="display:none">
  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-head">
      <div class="sidebar-brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <span class="brand-title">AP Repair CRM</span>
          <span class="brand-sub">Service Center</span>
        </div>
      </div>
      <button class="icon-btn sidebar-close" onclick="closeSidebar()" aria-label="Close navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-user" id="sidebar-user" onclick="toggleUserMenu()">
      <span id="sidebar-avatar" class="avatar">U</span>
      <span class="sidebar-user-meta">
        <span id="sidebar-name" class="sidebar-user-name">User</span>
        <span id="sidebar-role" class="sidebar-user-role">role</span>
      </span>
      <span class="sidebar-user-chevron" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </div>

    <div id="user-menu" class="user-menu" style="display:none">
      <div id="menu-company" class="menu-company"></div>
      <button class="menu-item" onclick="refreshAll()">Refresh Data</button>
      <button class="menu-item danger" onclick="doLogout()">Logout</button>
    </div>

    <!-- Navigation injected by renderNav() -->
    <nav id="nav" class="sidebar-nav"></nav>

    <div class="sidebar-foot">
      <div class="sidebar-foot-card">
        <div class="foot-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="foot-title">Need help?</div>
          <div class="foot-sub">v1.3.0 &middot; Secure &amp; Synced</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main shell -->
  <div class="main-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-left">
          <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()" aria-label="Toggle navigation">
            <span class="menu-btn-bars">
              <span></span><span></span><span></span>
            </span>
          </button>
          <button id="collapse-btn" class="collapse-btn hide-mobile" onclick="toggleSidebarCollapse()" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <div class="topbar-brand-mobile">
            <div class="brand-mark sm">A</div>
            <span class="topbar-title">AP Repair CRM</span>
          </div>
          <div class="topbar-divider hide-mobile"></div>
          <div id="topbar-page" class="topbar-page hide-mobile">
            <span id="topbar-page-icon" class="topbar-page-icon">&#9673;</span>
            <span id="topbar-page-title" class="topbar-page-title">Dashboard</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="user-chip" id="topbar-user-chip" onclick="toggleUserMenu()">
            <span id="user-avatar" class="avatar">U</span>
            <span class="user-meta hide-mobile">
              <span id="user-name">User</span>
              <span id="user-role" class="user-role">role</span>
            </span>
            <span class="user-chevron hide-mobile" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </div>
        </div>
      </div>
    </header>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast"></div>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-backdrop" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>

<!-- ============ INSTALL PROMPT ============ -->
<div id="install-banner" class="install-banner" style="display:none">
  <div class="icon">A</div>
  <div class="body">
    <b>Install AP Repair CRM</b>
    <p id="install-msg">Get the full app experience on your device.</p>
  </div>
  <div class="actions">
    <button class="btn sm" onclick="dismissInstall()">Not now</button>
    <button class="btn primary sm" id="install-btn">Install</button>
  </div>
</div>

<script src="app.js?v=13"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
